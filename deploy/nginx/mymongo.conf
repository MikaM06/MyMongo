server {
    listen 80;
    listen [::]:80;
    server_name mymongo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mymongo.example.com;

    ssl_certificate /etc/letsencrypt/live/mymongo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mymongo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mymongo:10m;

    client_max_body_size 20m;
    proxy_read_timeout 120s;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
